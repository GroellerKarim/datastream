spring.profiles.active=dev
spring.application.name=datastream-server2
spring.threads.virtual.enabled=true

# OAuth2 Resource Server (Keycloak)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/datastream}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/datastream/protocol/openid-connect/certs}
